<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的页 · 身份卡原型总览</title>
<style>
  :root {
    --bg: #f5f6f8;
    --ink: #1f2430;
    --sub: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 40px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { max-width: 2600px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
  .intro { font-size: 15px; color: var(--sub); margin: 0; line-height: 1.6; }
  .intro strong { color: var(--ink); }
  .row {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding-bottom: 12px;
    max-width: 100%;
    scrollbar-width: thin;
  }
  .cell { flex: 0 0 auto; }
  .cell .frame {
    width: 800px;
    height: 1000px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 4px 18px rgba(15, 23, 42, .08);
  }
  .cell iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 10px; }
  .caption {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    font-size: 14px;
    color: var(--ink);
  }
  .tag {
    display: inline-block;
    min-width: 26px;
    height: 26px;
    line-height: 26px;
    text-align: center;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
  }
  .kw { color: var(--sub); }
  .kw b { color: var(--ink); font-weight: 600; }
  .missing { color: #b42318; }
  footer { margin-top: 28px; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
  <header>
    <h1>我的页 · 身份卡原型总览</h1>
    <p class="intro">
      这是身份卡的<strong>三条设计路线</strong>，横向滚动并排查看，请挑选一条，或把三条的关键元素混搭出新方案。
    </p>
  </header>

  <div class="row">
    <div class="cell">
      <div class="frame"><iframe src="我的页-身份卡-A-学生证.html" title="A 学生证"></iframe></div>
      <div class="caption"><span class="tag">A</span><span class="kw">关键词：<b>学生证 · 证件照 · 校名抬头 · 权威感</b></span></div>
    </div>
    <div class="cell">
      <div class="frame"><iframe src="我的页-身份卡-B-数据卡.html" title="B 数据卡"></iframe></div>
      <div class="caption"><span class="tag">B</span><span class="kw">关键词：<b>数据卡 · 信息密度 · 字段列表 · 极简</b></span></div>
    </div>
    <div class="cell">
      <div class="frame"><iframe src="我的页-身份卡-C-折页.html" title="C 折页"></iframe></div>
      <div class="caption"><span class="tag">C</span><span class="kw">关键词：<b>折页 · 分层展开 · 可收纳 · 仪式感</b></span></div>
    </div>
  </div>

  <footer>纯静态 · 无依赖 · 双击即开 · 同目录相对路径引用</footer>
</body>
</html>
