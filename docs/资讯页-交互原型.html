<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23C74E17'/%3E%3Crect x='3' y='3' width='10' height='2' fill='%23F5F2EC'/%3E%3Crect x='3' y='7' width='10' height='2' fill='%23F5F2EC'/%3E%3Crect x='3' y='11' width='6' height='2' fill='%23F5F2EC'/%3E%3C/svg%3E">
<title>沈农在途 · 资讯页交互原型（规格实现）</title>
<style>
/* ══════════════════════════════════════════════════════════
   硬朗农业设计系统 · 红线：0 圆角 / 无渐变无阴影 / 等宽数字
   Token 值与 ui/theme/HardTokens.kt、Theme.kt 一一对应
   ══════════════════════════════════════════════════════════ */
:root, [data-theme="light"] {
  --paper:#F5F2EC; --card:#FAF8F4; --cardAlt:#EDE8DF;
  --ink:#1A1611; --inkSoft:#443E36; --inkFaint:#5F574C;
  --rule:#D7D0C4; --outline:#BEB5A6; --outlineStrong:#1A1611;
  --primary:#C74E17; --accent:#DE6A2E; --onPrimary:#FFFFFF;
  --brick:#9B2417; --amber:#8F6713; --olive:#3F5A2E; --slate:#345A66;
  --job:#5A3A46; --news:#37516B;
  --shadow:#1A1611; --scrim:rgba(0,0,0,.30);
  --wbBg:#EDE8DF; --wbPanel:#FAF8F4; --logBg:#1A1611; --logInk:#EDE8DF;
  --idWash:10%;
}
[data-theme="dark"] {
  --paper:#100E0B; --card:#1A1611; --cardAlt:#2B2621;
  --ink:#EDE8DF; --inkSoft:#A1978A; --inkFaint:#7E7468;
  --rule:#3E362C; --outline:#443E36; --outlineStrong:#A1978A;
  --primary:#EA8F5E; --accent:#DE6A2E; --onPrimary:#100E0B;
  --brick:#E7A093; --amber:#DDB84D; --olive:#BCC79B; --slate:#A0B6BB;
  --job:#B99BA6; --news:#7E9CC0;
  --shadow:#000000; --scrim:rgba(0,0,0,.50);
  --wbBg:#0B0907; --wbPanel:#1A1611; --logBg:#0B0907; --logInk:#EDE8DF;
  --idWash:22%;
}
* { box-sizing:border-box; margin:0; padding:0; border-radius:0 !important; }
html,body { height:100%; }
body {
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background:var(--wbBg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.num { font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace; font-feature-settings:"tnum","lnum"; }
button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--paper); }
::-webkit-scrollbar-thumb { background:var(--outline); }
::-webkit-scrollbar-thumb:hover { background:var(--primary); }
* { scrollbar-width:thin; scrollbar-color:var(--outline) var(--paper); }

/* ── 工作台（桌面外壳） ───────────────────────────── */
.workbench { display:flex; gap:24px; padding:24px; justify-content:center; align-items:flex-start; min-height:100%; }
.console { width:340px; flex:none; display:flex; flex-direction:column; gap:12px; }
.panel { background:var(--wbPanel); border:1px solid var(--outline); }
.panel-h { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--rule); }
.panel-h .bar { width:4px; height:16px; background:var(--primary); flex:none; }
.panel-h h2 { font-size:13px; font-weight:700; letter-spacing:.5px; }
.panel-b { padding:12px 14px; }
.brand { background:var(--ink); color:var(--paper); padding:16px 14px; border:1px solid var(--outline); }
[data-theme="dark"] .brand { background:var(--cardAlt); color:var(--ink); }
.brand h1 { font-size:18px; font-weight:800; letter-spacing:1px; }
.brand p { font-size:11px; margin-top:6px; opacity:.75; line-height:1.6; }
.brand .tag { display:inline-block; margin-top:8px; padding:2px 8px; border:1px solid currentColor; font-size:10px; letter-spacing:1px; }
.ctl-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.ctl-row:last-child { margin-bottom:0; }
.ctl-label { font-size:11px; color:var(--inkFaint); width:64px; flex:none; font-weight:500; }
.seg { display:flex; border:1px solid var(--outline); flex:1; }
.seg button { flex:1; padding:7px 4px; font-size:11px; font-weight:500; color:var(--inkSoft); border-right:1px solid var(--outline); min-height:32px; }
.seg button:last-child { border-right:none; }
.seg button[aria-pressed="true"] { background:var(--primary); color:var(--onPrimary); font-weight:700; }
.btn-line { display:flex; flex-wrap:wrap; gap:8px; }
.btn { border:1px solid var(--outline); padding:8px 12px; font-size:12px; font-weight:700; color:var(--inkSoft); min-height:36px; }
.btn:hover { border-color:var(--primary); color:var(--primary); }
.btn.warn { color:var(--brick); border-color:var(--brick); }
.state-table { width:100%; border-collapse:collapse; font-size:11px; }
.state-table td { padding:5px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
.state-table tr:last-child td { border-bottom:none; }
.state-table td:first-child { color:var(--inkFaint); width:96px; }
.state-table td:last-child { font-weight:700; text-align:right; }
.checks { list-style:none; font-size:11px; }
.checks li { display:flex; gap:8px; padding:4px 0; border-bottom:1px solid var(--rule); align-items:baseline; }
.checks li:last-child { border-bottom:none; }
.checks .ok { color:var(--olive); font-weight:800; flex:none; }
.checks .no { color:var(--brick); font-weight:800; flex:none; }
.log { background:var(--logBg); color:var(--logInk); border:1px solid var(--outline); max-height:220px; overflow-y:auto; padding:10px 12px; font-size:10.5px; line-height:1.7; }
.log .t { color:var(--primary); margin-right:6px; }
.log div { border-bottom:1px solid rgba(128,128,128,.15); padding:2px 0; word-break:break-all; }
.stage { flex:none; }
.phone { width:360px; height:800px; border:2px solid var(--outlineStrong); background:var(--paper); position:relative; box-shadow:2px 2px 0 var(--shadow); }
.screen { position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; background:var(--paper); }
.statusbar { height:24px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:10px; color:var(--inkSoft); background:var(--paper); border-bottom:1px solid var(--rule); }
.phone-cap { text-align:center; font-size:10px; color:var(--inkFaint); margin-top:10px; letter-spacing:1px; }

/* ── 资讯页 chrome ───────────────────────────────── */
#feedWrap { flex:1; min-height:0; display:flex; flex-direction:column; }
.hd { display:flex; align-items:center; padding:8px 8px 8px 16px; gap:4px; }
.hd .ttl { flex:1; min-width:0; }
.hd h1 { font-size:20px; font-weight:800; color:var(--ink); line-height:26px; }
.hd .sub { display:flex; align-items:center; gap:4px; font-size:11px; line-height:15px; color:var(--inkFaint); margin-top:2px; flex-wrap:wrap; }
.hd .sub .dot { width:6px; height:6px; border-radius:50% !important; background:var(--primary); flex:none; }
.hd .sub b { color:var(--ink); font-weight:700; }
.hd .sep { color:var(--rule); }
.icon-btn { min-width:48px; min-height:48px; display:flex; align-items:center; justify-content:center; }
.icon-btn .glyph { width:32px; height:32px; border:1px solid var(--outline); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--inkSoft); }
.icon-btn:hover .glyph { border-color:var(--primary); color:var(--primary); }
.txt-btn { min-height:48px; padding:0 10px; font-size:14px; font-weight:700; color:var(--primary); }
.txt-btn:disabled { color:var(--inkFaint); cursor:default; }
.search-row { display:flex; align-items:center; gap:4px; padding:4px 16px; min-height:48px; }
.search-box { flex:1; min-width:0; display:flex; align-items:center; height:34px; background:var(--card); border:1px solid var(--outline); }
.search-box.active { border-color:var(--primary); }
.search-box .mag { width:32px; flex:none; text-align:center; font-size:15px; color:var(--inkFaint); }
.search-box.active .mag { color:var(--primary); }
.search-box input { flex:1; min-width:0; border:none; background:none; font-size:12.5px; color:var(--ink); height:32px; padding-right:6px; }
.search-box input::placeholder { color:var(--inkFaint); }
.search-box input:focus { outline:none; }
.search-box .clr { width:32px; height:32px; flex:none; font-size:12px; color:var(--inkFaint); }
.tgl { height:34px; min-width:34px; padding:0 12px; border:1px solid var(--outline); font-size:12px; color:var(--inkSoft); display:flex; align-items:center; justify-content:center; flex:none; }
.tgl.sq { padding:0; width:34px; }
.tgl[aria-pressed="true"] { background:var(--primary); border-color:var(--primary); color:var(--onPrimary); font-weight:700; }
.tgl.star[aria-pressed="true"] { background:var(--amber); border-color:var(--amber); }
.strip { margin:8px 16px 0; height:40px; flex:none; display:flex; align-items:center; background:var(--card); border:1px solid var(--brick); border-left:3px solid var(--brick); cursor:pointer; }
.strip .tx { flex:1; min-width:0; padding:0 8px 0 10px; font-size:12px; font-weight:500; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.strip .tx b { color:var(--brick); font-weight:700; }
.strip .x { width:40px; height:38px; flex:none; font-size:12px; color:var(--inkFaint); }
.banner { margin:4px 16px 0; height:36px; flex:none; display:flex; align-items:center; background:var(--card); border:1px solid var(--olive); border-left:3px solid var(--olive); }
.banner.partial { border-color:var(--amber); border-left-color:var(--amber); }
.banner.fail { border-color:var(--brick); border-left-color:var(--brick); }
.banner .tx { flex:1; min-width:0; padding:0 8px 0 10px; font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.banner .act { flex:none; padding:0 10px; height:34px; font-size:12px; font-weight:700; color:var(--olive); }
.banner.partial .act { color:var(--amber); }
.banner.fail .act { color:var(--brick); }
.banner .x { width:32px; height:34px; flex:none; font-size:11px; color:var(--inkFaint); }
.chips { display:flex; gap:4px; overflow-x:auto; padding:9px 16px; min-height:48px; flex:none; align-items:center; }
.chip { height:30px; flex:none; display:flex; align-items:center; gap:4px; padding:0 12px; border:1px solid var(--outline); font-size:12px; color:var(--inkSoft); position:relative; }
.chip::after { content:""; position:absolute; inset:-9px 0; } /* 48dp 触区 */
.chip .n { font-size:9.5px; color:var(--primary); font-weight:700; }
.chip[aria-selected="true"] { background:var(--ch); border-color:var(--ch); color:var(--onPrimary); font-weight:700; }
.chip[aria-selected="true"] .n { color:var(--onPrimary); opacity:.75; }
.meta { display:flex; align-items:center; min-height:28px; padding:0 8px 0 16px; flex:none; gap:8px; }
.meta .info { flex:1; min-width:0; font-size:10px; color:var(--inkFaint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta .info b { color:var(--ink); font-weight:700; }
.meta .mark { flex:none; min-height:28px; padding:0 8px; font-size:14px; font-weight:700; color:var(--primary); position:relative; }
.meta .mark::after { content:""; position:absolute; inset:-10px 0; }

/* ── 列表 ────────────────────────────────────────── */
#listScroll { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:4px 16px 24px; touch-action:pan-y; }
.ghead { position:sticky; top:0; z-index:5; background:var(--paper); display:flex; align-items:center; gap:8px; height:28px; margin-top:8px; cursor:default; }
.ghead.fold { cursor:pointer; }
.ghead.fold::after { content:""; position:absolute; inset:-10px 0; }
.ghead .lb { font-size:10px; font-weight:700; letter-spacing:1px; color:var(--inkFaint); white-space:nowrap; }
.ghead .ct { font-size:10px; color:var(--inkFaint); }
.ghead .ln { flex:1; height:1px; background:var(--rule); }
.ghead .ar { font-size:10px; color:var(--inkFaint); }
.card { background:var(--card); border:1px solid var(--outline); margin-top:8px; cursor:pointer; position:relative; user-select:none; -webkit-user-select:none; }
.card:active { background:var(--cardAlt); }
.card.urgent { border-left:3px solid var(--brick); }
/* 标准卡 */
.card.std .body { display:flex; gap:12px; padding:12px; }
.idblock { width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--ch); background:color-mix(in srgb, var(--ch) var(--idWash), transparent); border:1px solid color-mix(in srgb, var(--ch) 45%, transparent); }
.card .col { flex:1; min-width:0; }
.metarow { display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--inkSoft); }
.metarow .src { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%; }
.metarow .d { font-size:9.5px; color:var(--inkFaint); }
.metarow .sp { flex:1; }
.star-badge { flex:none; height:16px; padding:0 4px; border:1px solid var(--amber); color:var(--amber); font-size:9px; font-weight:700; display:flex; align-items:center; }
.udot { width:6px; height:6px; flex:none; border-radius:50% !important; background:var(--primary); }
.card .title { font-size:15px; line-height:21px; font-weight:700; color:var(--ink); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card.read .title { font-weight:500; color:var(--inkSoft); }
.card .summ { font-size:12px; line-height:18px; color:var(--inkFaint); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .rule { height:1px; background:color-mix(in srgb, var(--outline) 70%, transparent); }
.card .foot { display:flex; align-items:center; gap:8px; height:28px; padding:0 12px; font-size:9.5px; }
.card .foot .cat { font-weight:500; color:var(--ch); }
.card .foot .dl { font-weight:700; }
.card .foot .sp { flex:1; }
.card .foot .go { font-size:13px; color:var(--inkFaint); }
/* 紧凑卡 */
.card.cmp { display:flex; border-left:3px solid var(--ch); }
.card.cmp.urgent { border-left-color:var(--brick); }
.card.cmp .body { flex:1; min-width:0; padding:8px 12px; }
.card.cmp .title { font-size:14px; line-height:20px; margin-top:0; }
.card.cmp .metarow { margin-top:2px; font-size:9.5px; line-height:13px; color:var(--inkFaint); }
.card.cmp .metarow .src { font-weight:400; color:var(--inkFaint); }
.dl-urgent { color:var(--brick); }
.dl-warn { color:var(--amber); }
.dl-normal { color:var(--inkFaint); font-weight:500 !important; }
/* 骨架 / 分页脚 / 空态 */
.sk { background:var(--card); border:1px solid var(--outline); margin-top:8px; padding:12px; display:flex; gap:12px; }
.sk .b { width:32px; height:32px; background:var(--cardAlt); flex:none; }
.sk .lines { flex:1; }
.sk .l { height:12px; background:var(--rule); margin-bottom:8px; }
.sk .l.s { height:10px; }
.sk-note { text-align:center; font-size:12px; color:var(--inkFaint); padding:12px 0 4px; }
.pfoot { height:48px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:10px; color:var(--inkFaint); border-top:1px solid var(--rule); margin-top:8px; cursor:pointer; }
.empty { padding-top:56px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.empty .glyph { width:38px; height:38px; border:1px solid var(--outline); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--inkFaint); }
.empty .m { font-size:13px; font-weight:500; color:var(--inkSoft); margin-top:12px; }
.empty .s { font-size:11px; color:var(--inkFaint); margin-top:4px; }
.empty .btn { margin-top:12px; color:var(--primary); border-color:var(--outline); font-size:14px; }

/* ── 底部 tab ────────────────────────────────────── */
.tabbar { flex:none; background:var(--card); }
.tabbar .track { height:3px; background:var(--rule); position:relative; }
.tabbar .ind { position:absolute; top:0; left:0; height:3px; width:120px; background:var(--primary); transition:transform 180ms ease; }
.tabbar .row { display:flex; height:56px; }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative; }
.tab .ic { width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
.tab .ic svg { width:20px; height:20px; fill:var(--inkFaint); }
.tab[aria-selected="true"] .ic svg { fill:var(--primary); }
.tab .lb { font-size:10px; color:var(--inkFaint); }
.tab[aria-selected="true"] .lb { color:var(--primary); font-weight:700; }
.tab .badge { position:absolute; top:4px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px; background:var(--primary); color:var(--onPrimary); font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--inkFaint); }
.placeholder .glyph { width:48px; height:48px; border:1px solid var(--outline); display:flex; align-items:center; justify-content:center; font-size:16px; }
.placeholder .m { font-size:14px; font-weight:700; color:var(--inkSoft); }
.placeholder .s { font-size:11px; }

/* ── 浮层：菜单 / 对话框 / 撤销 / 详情 / toast ────── */
.ov { position:absolute; inset:0; z-index:40; }
.scrim { position:absolute; inset:0; background:var(--scrim); }
.sheet { position:absolute; left:0; right:0; bottom:0; background:var(--paper); border:1.5px solid var(--outline); transform:translateY(0); animation:sheetIn 180ms ease; max-height:82%; overflow-y:auto; }
@keyframes sheetIn { from { transform:translateY(320px); } to { transform:translateY(0); } }
.sheet .topbar { height:5px; background:var(--ch, var(--primary)); }
.sheet .head { display:flex; gap:10px; align-items:center; padding:12px 16px 8px; }
.sheet .head .idblock { width:32px; height:32px; }
.sheet .head .t { flex:1; min-width:0; }
.sheet .head .t .a { font-size:15px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sheet .head .t .b { font-size:9.5px; color:var(--inkFaint); margin-top:2px; }
.sheet .hr { height:1px; background:var(--rule); }
.mrow { display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:12px 16px; min-height:48px; border-bottom:1px solid var(--rule); }
.mrow:hover { background:var(--cardAlt); }
.mrow .idx { font-size:9px; color:var(--inkFaint); flex:none; }
.mrow .tt { flex:1; min-width:0; display:block; }
.mrow .tt .a { display:block; font-size:14px; font-weight:500; color:var(--ink); }
.mrow .tt .b { display:block; font-size:9.5px; line-height:13px; color:var(--inkFaint); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mrow.disabled { opacity:.45; cursor:default; }
.mrow.disabled:hover { background:none; }
.sheet .cancel { height:48px; width:100%; font-size:12.5px; color:var(--inkFaint); }
.sheet .navpad { height:4px; }
.dialog-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; }
.dialog { background:var(--card); border:1.5px solid var(--outline); width:100%; padding:20px; animation:dlgIn 120ms ease; }
@keyframes dlgIn { from { opacity:0; } to { opacity:1; } }
.dialog h3 { font-size:16px; font-weight:700; color:var(--ink); }
.dialog p { font-size:13px; line-height:20px; color:var(--inkSoft); margin-top:12px; }
.dialog .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
.dialog .acts button { min-height:40px; padding:0 16px; font-size:14px; }
.dialog .acts .no { font-weight:500; color:var(--inkSoft); }
.dialog .acts .yes { font-weight:700; color:var(--primary); border:1px solid var(--primary); }
.undo { position:absolute; left:16px; right:16px; bottom:70px; z-index:60; height:48px; background:var(--ink); color:var(--paper); display:flex; align-items:center; padding:0 8px 0 14px; gap:8px; box-shadow:2px 2px 0 var(--shadow); animation:undoIn 180ms ease; }
[data-theme="dark"] .undo { background:var(--cardAlt); color:var(--ink); }
@keyframes undoIn { from { transform:translateY(16px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.undo .tx { flex:1; min-width:0; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.undo button { flex:none; min-height:48px; padding:0 10px; font-size:12px; font-weight:700; color:var(--accent); }
[data-theme="dark"] .undo button { color:var(--primary); }
.toast { position:absolute; left:50%; transform:translateX(-50%); bottom:120px; z-index:70; background:var(--ink); color:var(--paper); font-size:12px; padding:10px 16px; box-shadow:2px 2px 0 var(--shadow); animation:dlgIn 120ms ease; white-space:nowrap; }

const DEFAULT_DENSITY = {"全部":"std","竞赛":"std","教务":"std","就业":"cmp","通知":"std","学工":"std","新闻":"cmp"};

  items: seed(),
  reserve: reserveItems(),

  density: {...DEFAULT_DENSITY},
  window: {}, collapsed: {"已截止":true},
  scroll: {},
  loading:false, lastSync: Date.now()-32*60000,
  network:"ok", failedSources:[],
  banner:null,            // {kind:'ok'|'partial'|'fail'|'info', text}
  undo:null,              // {keys:[], label}
  menu:null,              // {type:'card'|'more'|'fails', key?}
  dialog:null,            // 'globalRead'

function log(msg){ const d=new Date(); S.log.unshift({t:pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()), msg}); if(S.log.length>60)S.log.pop(); renderConsole(); }
function globalUnread(){ return S.items.filter(i=>!i.readAt).length; }
function channelUnread(c){ return S.items.filter(i=>!i.readAt && (c==="全部"||i.category===c)).length; }
function channelItems(c){ return S.items.filter(i=>c==="全部"||i.category===c); }
function matchQ(i){ const q=S.query.trim(); if(!q)return true; const hay=i.title+" "+i.summary+" "+i.sourceName; return q.split(/[\s\u3000]+/).filter(Boolean).every(w=>hay.toLowerCase().includes(w.toLowerCase())); }
function filtered(c){ return channelItems(c).filter(i=>matchQ(i)&&(!S.onlyUnread||!i.readAt)&&(!S.starredOnly||i.starred)); }
function hasFilter(){ return S.query.trim()||S.onlyUnread||S.starredOnly; }
function urgentContests(){ return S.items.filter(i=>i.category==="竞赛"&&i.deadline).map(i=>({i,d:daysLeft(i.deadline)})).filter(x=>x.d!==null&&x.d>=0&&x.d<=3).sort((a,b)=>a.d-b.d); }
function dlInfo(i){
  if(i.category!=="竞赛"||!i.deadline) return null;
  const d=daysLeft(i.deadline); if(d===null) return null;
  if(d<0) return {text:"已截止 "+md(i.deadline), cls:"dl-normal", d};
  if(d===0) return {text:"今天截止", cls:"dl-urgent", d};
  if(d<=3) return {text:"剩 "+d+" 天", cls:"dl-urgent", d};
  if(d<=7) return {text:"剩 "+d+" 天", cls:"dl-warn", d};
  return {text:"截止 "+md(i.deadline), cls:"dl-normal", d};
}
function bucketOf(i){
  const t=new Date(); const today=dstr(0);
  if(!i.publishedAt) return "更早";
  if(i.publishedAt===today) return "今天";
  if(i.publishedAt===dstr(-1)) return "昨天";
  return i.publishedAt>dstr(-7) ? "本周" : "更早";
}
/* 派生行：分组 + 排序 + 折叠 + 窗口 */
function deriveRows(c){
  let list=filtered(c);
  const groups=[];
  if(c==="竞赛"){
    const g={"即将截止":[],"报名中":[],"时间待定":[],"已截止":[]};
    list.forEach(i=>{ const d=daysLeft(i.deadline);
      if(d===null) g["时间待定"].push(i);
      else if(d<0) g["已截止"].push(i);
      else if(d<=7) g["即将截止"].push(i);
      else g["报名中"].push(i); });
    g["即将截止"].sort((a,b)=>a.deadline<b.deadline?-1:1);
    g["报名中"].sort((a,b)=>a.deadline<b.deadline?-1:1);
    g["时间待定"].sort((a,b)=>a.publishedAt>b.publishedAt?-1:1);
    g["已截止"].sort((a,b)=>a.deadline>b.deadline?-1:1);   // 最近截止最前（规格 §8.1）
    ["即将截止","报名中","时间待定","已截止"].forEach(n=>{ if(g[n].length) groups.push({name:n, items:g[n], foldable:true}); });
  } else {
    list.sort((a,b)=> a.publishedAt===b.publishedAt ? (a.key<b.key?1:-1) : (a.publishedAt>b.publishedAt?-1:1));
    const order=["今天","昨天","本周","更早"], g={};
    list.forEach(i=>{ const b=bucketOf(i); (g[b]=g[b]||[]).push(i); });
    order.forEach(n=>{ if(g[n]) groups.push({name:n, items:g[n], foldable:false}); });
  }
  const rows=[]; let count=0; const win=S.window[c]||30; let totalVisible=0;
  groups.forEach(g=>{
    const folded = g.foldable && S.collapsed[g.name];
    rows.push({type:"head", name:g.name, count:g.items.length, foldable:g.foldable, folded});
    if(folded) return;
    g.items.forEach(i=>{
      totalVisible++;
      if(count<win){ rows.push({type:"card", item:i}); count++; }
    });
  });
  return {rows, shown:count, total:totalVisible, allCount:list.length};
}

  return '<div class="empty"><span class="glyph" aria-hidden="true">'+glyph+'</span><span class="m">'+esc(m)+'</span><span class="s">'+esc(s)+'</span>'+act+'</div>';
}

function resetWindow(){ CATS.forEach(c=>S.window[c]=30); }
function setChannel(c, scrollKey){
  if(S.channel!==c){ S.scroll[S.channel]=listScrollEl?listScrollEl.scrollTop:0; }
  S.channel=c; S.window[c]=S.window[c]||30;
  renderChrome(); renderConsole();
  if(scrollKey){ requestAnimationFrame(()=>{ const el=document.querySelector('[data-key="'+scrollKey+'"]'); if(el&&listScrollEl){ el.scrollIntoView({block:"center"}); } }); }
  log("切换频道 → "+c);
}
function setBanner(kind,text,autoMs){
  clearTimeout(timers.banner); S.banner={kind,text};
  if(autoMs) timers.banner=setTimeout(()=>{ S.banner=null; renderChrome(); },autoMs);
}
function toast(text){
  clearTimeout(timers.toast); S.toast=text; renderOverlays();
  timers.toast=setTimeout(()=>{ S.toast=null; renderOverlays(); },1600);
}
function markReadBatch(keys, label){
  if(!keys.length) return;
  const now=Date.now();
  S.items.forEach(i=>{ if(keys.includes(i.key)) i.readAt=now; });
  clearTimeout(timers.undo);
  S.undo={keys:[...keys], label, done:false};
  timers.undo=setTimeout(()=>{ S.undo=null; renderOverlays(); },5000);
  renderChrome(); renderTab(); renderOverlays(); renderConsole();
  log(label);
}
function doUndo(){
  if(!S.undo||S.undo.done) return;
  S.items.forEach(i=>{ if(S.undo.keys.includes(i.key)) i.readAt=null; });
  S.undo={...S.undo, label:"已撤销", done:true};
  clearTimeout(timers.undo);
  timers.undo=setTimeout(()=>{ S.undo=null; renderOverlays(); },1000);
  renderChrome(); renderTab(); renderOverlays(); renderConsole();
  log("撤销批量已读（"+S.undo.keys.length+" 条恢复未读）");
}
function openDetail(key){
  const i=S.items.find(x=>x.key===key); if(!i) return;
  if(!i.readAt){ i.readAt=Date.now(); log("点开详情 → 标为已读："+i.title.slice(0,18)+"…"); }
  S.menu=null;
  if(i.bodyFetched){
    S.detail={key, loading:false, error:false};
    renderChrome(); renderTab(); renderOverlays(); renderConsole();
    return;
  }
  S.detail={key, loading:true, error:false};
  renderChrome(); renderTab(); renderOverlays(); renderConsole();
  clearTimeout(timers.detail);
  timers.detail=setTimeout(()=>{
    if(!S.detail||S.detail.key!==key) return;
    if(S.network==="fail"){ S.detail={key,loading:false,error:true}; log("正文抓取失败（网络模拟：全部失败）"); }
    else { i.bodyFetched=true; S.detail={key,loading:false,error:false}; log("正文抓取成功 → 永久缓存："+i.title.slice(0,18)+"…"); }
    renderOverlays(); renderConsole();
  },900);
}
function doRefresh(){
  if(S.loading) return;
  S.loading=true; S.menu=null; renderChrome(); renderConsole();
  log("刷新开始（旧数据保持可见）");
  setTimeout(()=>{
    S.loading=false;
    if(S.network==="fail"){
      S.failedSources=[{name:"教务通知",error:"网络不可用（连接超时）"},{name:"竞赛平台",error:"网络不可用（连接超时）"},{name:"沈农新闻",error:"网络不可用（连接超时）"}];
      setBanner("fail","刷新失败 · 网络不可用");
      log("刷新失败：3 个源全部失败，旧数据保留");
    } else {
      const add=S.reserve.splice(0, S.network==="partial"?1:2);
      add.forEach(i=>S.items.unshift(i));
      S.lastSync=Date.now();
      if(S.network==="partial"){
        S.failedSources=[{name:"挑战杯",error:"HTTP 502"},{name:"辽宁省教育厅",error:"解析出 0 条（页面结构可能变了）"}];
        setBanner("partial","新增 "+add.length+" 条 · 2 个源失败");
        log("刷新部分成功：新增 "+add.length+" 条，2 个源失败");
      } else {
        S.failedSources=[];
        setBanner("ok", add.length?"新增 "+add.length+" 条":"已是最新", 4000);
        log("刷新成功：新增 "+add.length+" 条");
      }
    }
    renderChrome(); renderTab(); renderConsole();
  },1200);
}
function coldStart(){
  S.items=[]; S.reserve=reserveItems(); resetWindow(); S.scroll={}; S.loading=true; S.banner=null; S.detail=null; S.menu=null;
  renderAll(); log("模拟冷启动：空缓存 → 首帧骨架，首帧后补抓");
  setTimeout(()=>{
    S.loading=false;
    if(S.network==="fail"){ S.failedSources=[{name:"教务通知",error:"网络不可用（连接超时）"}]; setBanner("fail","刷新失败 · 网络不可用"); log("首抓失败 → 空态 + 重试"); }
    else { S.items=seed(); S.lastSync=Date.now(); setBanner("ok","新增 "+S.items.length+" 条",4000); log("首抓成功："+S.items.length+" 条入库"); }
    renderAll();
  },1500);
}
function toggleStar(key){
  const i=S.items.find(x=>x.key===key); if(!i) return;
  i.starred=!i.starred;
  log((i.starred?"收藏":"取消收藏")+"："+i.title.slice(0,18)+"…");
  renderChrome(); renderOverlays(); renderConsole();
}
function copyItem(key){
  const i=S.items.find(x=>x.key===key); if(!i) return;
  const text=i.title+"\n"+i.sourceName+" · "+i.publishedAt+(i.category==="竞赛"&&i.deadline?"\n报名截止："+i.deadline:"")+"\n"+i.url;
  const done=()=>{ S.copiedKey=key; renderOverlays(); log("复制标题到剪贴板"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done();}); }
  else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }
function openUrl(key){ const i=S.items.find(x=>x.key===key); if(!i)return; log("浏览器打开："+i.url); window.open(i.url,"_blank","noopener"); }
function loadMore(){
  const c=S.channel, d=deriveRows(c);
  if(d.shown>=d.total) return;
  S.window[c]=(S.window[c]||30)+30;
  const st=listScrollEl?listScrollEl.scrollTop:0;
  renderList(); if(listScrollEl) listScrollEl.scrollTop=st;
  renderConsole();
  log("渲染分页 +30 → "+S.window[c]+"（本地，无网络）");
}
function onListScroll(){
  const el=listScrollEl; if(!el) return;
  S.scroll[S.channel]=el.scrollTop;
  if(el.scrollTop+el.clientHeight>=el.scrollHeight-200) loadMore();
}

/* ── 事件委托 ── */
document.addEventListener("click", e=>{
  if(suppressClick) return; // 长按/横滑刚结束，吞掉紧随的 click，避免误开详情或误关菜单
  const t=e.target.closest("[data-act]");
  if(!t) {
    const card=e.target.closest("[data-card]");
    if(card && !suppressClick){ openDetail(card.dataset.card); }
    return;
  }
  const act=t.dataset.act, v=t.dataset.v, key=t.dataset.key;
  switch(act){
    case "tab": S.tab=v; renderAll(); log("底部 tab → "+v); break;
    case "chip": if(!suppressClick) setChannel(v); break;
    case "theme": document.documentElement.dataset.theme=v; renderConsole(); log("主题 → "+(v==="dark"?"暗色":"亮色")); break;
    case "net": S.network=v; renderConsole(); log("网络模拟 → "+{ok:"正常",partial:"部分失败",fail:"全部失败"}[v]); break;
    case "reset": S.items=seed(); S.reserve=reserveItems(); S.query=""; S.onlyUnread=false; S.starredOnly=false; S.density={...DEFAULT_DENSITY}; S.collapsed={"已截止":true}; S.dismissed=null; S.banner=null; S.undo=null; S.detail=null; S.menu=null; S.failedSources=[]; S.lastSync=Date.now()-32*60000; resetWindow(); S.scroll={}; renderAll(); log("重置演示数据（"+S.items.length+" 条）"); break;
    case "all-unread": S.items.forEach(i=>i.readAt=null); renderAll(); log("QA：全部标为未读"); break;
    case "cold": coldStart(); break;
    case "refresh": doRefresh(); break;
    case "more": S.menu={type:"more"}; S.copiedKey=null; renderOverlays(); break;
    case "close-menu": S.menu=null; S.copiedKey=null; renderOverlays(); break;
    case "close-dialog": S.dialog=null; renderOverlays(); break;
    case "unread": S.onlyUnread=!S.onlyUnread; resetWindow(); renderChrome(); renderConsole(); log("未读筛选 → "+(S.onlyUnread?"开":"关")); break;
    case "unread-off": S.onlyUnread=false; resetWindow(); renderChrome(); renderConsole(); break;
    case "starred": S.starredOnly=!S.starredOnly; resetWindow(); renderChrome(); renderConsole(); log("收藏筛选 → "+(S.starredOnly?"开":"关")); break;
    case "clearf": S.query=""; S.onlyUnread=false; S.starredOnly=false; resetWindow(); renderChrome(); renderConsole(); log("清空全部筛选"); break;
    case "qclear": S.query=""; resetWindow(); renderChrome(); renderConsole(); break;
    case "strip": { const urg=urgentContests(); setChannel("竞赛", urg.length?urg[0].i.key:null); break; }
    case "strip-x": e.stopPropagation(); S.dismissed={date:dstr(0), keys:urgentContests().map(x=>x.i.key).sort().join(",")}; renderChrome(); renderConsole(); log("关闭截止提醒条（今日同集合不再出现）"); break;
    case "banner-x": S.banner=null; renderChrome(); break;
    case "fails": S.menu={type:"fails"}; renderOverlays(); break;
    case "more-fails": S.menu={type:"fails"}; renderOverlays(); break;
    case "mark-channel": { const keys=channelItems(S.channel).filter(i=>!i.readAt).map(i=>i.key); markReadBatch(keys,"已把「"+S.channel+"」"+keys.length+" 条标为已读"); break; }
    case "more-channel": { const keys=channelItems(S.channel).filter(i=>!i.readAt).map(i=>i.key); S.menu=null; markReadBatch(keys,"已把「"+S.channel+"」"+keys.length+" 条标为已读"); break; }
    case "more-global": S.menu=null; S.dialog="globalRead"; renderOverlays(); break;
    case "confirm-global": { const keys=S.items.filter(i=>!i.readAt).map(i=>i.key); S.dialog=null; markReadBatch(keys,"已把全部 "+keys.length+" 条标为已读"); break; }
    case "more-density": S.density[S.channel]=S.density[S.channel]==="cmp"?"std":"cmp"; S.menu=null; setBanner("info","已切换为"+(S.density[S.channel]==="cmp"?"紧凑":"标准")+"密度（仅「"+S.channel+"」）",4000); renderChrome(); renderConsole(); log("密度切换："+S.channel+" → "+(S.density[S.channel]==="cmp"?"紧凑":"标准")); break;
    case "undo": doUndo(); break;
    case "fold": S.collapsed[v]=!S.collapsed[v]; renderList(); renderConsole(); log("分组「"+v+"」→ "+(S.collapsed[v]?"折叠":"展开")); break;
    case "unfold-closed": S.collapsed["已截止"]=false; renderList(); renderConsole(); break;
    case "more-page": loadMore(); break;
    case "card-read": { const i=S.items.find(x=>x.key===key); if(i){ i.readAt=i.readAt?null:Date.now(); log((i.readAt?"长按标为已读":"长按标为未读")+"："+i.title.slice(0,18)+"…"); } S.menu=null; renderChrome(); renderTab(); renderOverlays(); renderConsole(); break; }
    case "card-star": toggleStar(key); break;
    case "card-copy": copyItem(key); break;
    case "card-open": openUrl(key); S.menu=null; renderOverlays(); break;
    case "detail-star": toggleStar(key); break;
    case "close-detail": S.detail=null; clearTimeout(timers.detail); renderOverlays(); break;
    case "retry-body": openDetail(key); break;
    case "open-url": openUrl(key); break;
    case "noop": break;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(S.menu){ S.menu=null; S.copiedKey=null; renderOverlays(); }
    else if(S.dialog){ S.dialog=null; renderOverlays(); }
    else if(S.detail){ S.detail=null; clearTimeout(timers.detail); renderOverlays(); }
  }
  if(e.key==="Enter"){
    const card=e.target.closest&&e.target.closest("[data-card]");
    if(card) openDetail(card.dataset.card);
    const g=e.target.closest&&e.target.closest('.ghead.fold');
    if(g){ S.collapsed[g.dataset.v]=!S.collapsed[g.dataset.v]; renderList(); renderConsole(); }
  }
});
/* 长按（500ms）+ 右键 → 卡片菜单；横滑 → 切频道 */
let lpTimer=null, lpStart=null, suppressClick=false, swipe=null;
document.addEventListener("pointerdown", e=>{
  const card=e.target.closest&&e.target.closest("[data-card]");
  const chip=e.target.closest&&e.target.closest("[data-chip]");
  if(card){
    lpStart={x:e.clientX,y:e.clientY,key:card.dataset.card};
    clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{ suppressClick=true; S.menu={type:"card",key:lpStart.key}; S.copiedKey=null; renderOverlays(); if(navigator.vibrate)navigator.vibrate(10); log("长按卡片 → 快捷菜单"); lpStart=null; },500);
  } else if(chip){
    lpStart={x:e.clientX,y:e.clientY,chip:chip.dataset.chip};
    clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{ suppressClick=true; const c=lpStart.chip; const keys=channelItems(c).filter(i=>!i.readAt).map(i=>i.key); if(keys.length) markReadBatch(keys,"已把「"+c+"」"+keys.length+" 条标为已读（长按 chip）"); lpStart=null; },500);
  }
  if(e.target.closest&&e.target.closest("#listScroll")){ swipe={x:e.clientX,y:e.clientY,t:Date.now(),active:true}; }
});
document.addEventListener("pointermove", e=>{
  if(lpStart && (Math.abs(e.clientX-lpStart.x)>10||Math.abs(e.clientY-lpStart.y)>10)){ clearTimeout(lpTimer); lpStart=null; }
});
document.addEventListener("pointerup", e=>{
  clearTimeout(lpTimer);
  if(swipe&&swipe.active){
    const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-swipe.t<600){
      const idx=CATS.indexOf(S.channel);
      const ni=dx<0?Math.min(idx+1,CATS.length-1):Math.max(idx-1,0);
      if(ni!==idx){ suppressClick=true; setChannel(CATS[ni]); }
    }
    swipe=null;
  }
  lpStart=null;
  setTimeout(()=>{suppressClick=false;},50);
});
document.addEventListener("pointercancel", ()=>{ clearTimeout(lpTimer); lpStart=null; swipe=null; });
document.addEventListener("contextmenu", e=>{
  const card=e.target.closest&&e.target.closest("[data-card]");
  if(card){ e.preventDefault(); S.menu={type:"card",key:card.dataset.card}; S.copiedKey=null; renderOverlays(); log("右键卡片 → 快捷菜单"); }
});

/* ── 时钟 / 初始化 ── */
function tick(){ const d=new Date(); $("#clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes()); }
if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme="dark";
tick(); setInterval(tick,30000);
renderAll();
log("原型就绪：种子 "+S.items.length+" 条 · 7 频道 · 紧急竞赛 "+urgentContests().length+" 项");
/* QA 钩子 */
window.__demo={S, deriveRows, urgentContests, globalUnread, channelUnread, setChannel, openDetail, doRefresh, markReadBatch, loadMore};
</script>
